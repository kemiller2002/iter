name: Publish NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and test
        run: |
          dotnet restore Iter.slnx
          dotnet build Iter.slnx --configuration Release --no-restore
          dotnet run --project tests/Iter.Tests/Iter.Tests.fsproj --configuration Release --no-build
          bash scripts/measure-size.sh

      - name: Pack
        run: dotnet pack src/Iter/Iter.fsproj --configuration Release --no-build --output artifacts

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ secrets.NUGET_API_KEY }}" --skip-duplicate
